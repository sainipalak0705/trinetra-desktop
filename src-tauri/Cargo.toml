[package]
name = "trinetra"
version = "1.0.0"
description = "TRINETRA — AI-powered Cybersecurity Command Center"
authors = ["TRINETRA Team"]
license = "MIT"
repository = ""
default-run = "trinetra"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "trinetra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trinetra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another for better optimization
lto = true        # Enables link to optimize across crates boundaries
opt-level = "s"   # Optimize for binary size
strip = true      # Automatically strip symbols from the binary
