<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TRINETRA</title>
  <meta name="description" content="Sign in to the TRINETRA security dashboard.">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">

<!-- Background -->
<div class="auth-bg" aria-hidden="true">
  <div class="auth-bg-grid"></div>
  <div class="auth-bg-glow-left"></div>
  <div class="auth-bg-glow-right"></div>
</div>

<!-- Nav -->
<nav class="auth-nav" aria-label="Authentication navigation">
  <a href="index.html" class="auth-nav-back" id="login-back-btn">
    ← Back to site
  </a>
  <a href="signup.html" class="btn btn-ghost btn-sm" id="login-signup-link">
    Create account →
  </a>
</nav>

<!-- Toast -->
<div id="toast-container" aria-live="polite"></div>

<!-- Main -->
<main class="auth-container" id="main-content">
  <div class="auth-panel animate-fade-in">

    <!-- Logo -->
    <a href="index.html" class="auth-logo" aria-label="TRINETRA Home">
      <div class="auth-logo-icon" aria-hidden="true">🛡</div>
      <div>
        <div class="auth-logo-name">TRINETRA</div>
        <div style="font-size:10px;color:var(--white-500);letter-spacing:0.1em;font-family:var(--font-mono)">CYBER RESILIENCE</div>
      </div>
    </a>

    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-subheading">Sign in to access your security dashboard</p>

    <!-- Form Card -->
    <div class="auth-card">

      <!-- Error -->
      <div class="auth-error" id="login-error" role="alert" aria-live="assertive">
        <span aria-hidden="true">⚠</span>
        <span id="login-error-text">Invalid credentials</span>
      </div>

      <form id="login-form" novalidate>
        <!-- Email -->
        <div class="auth-form-group">
          <label class="auth-label" for="login-email">Email Address</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon" aria-hidden="true">@</span>
            <input
              type="email"
              id="login-email"
              class="auth-input"
              placeholder="Enter your email address"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <!-- Password -->
        <div class="auth-form-group">
          <label class="auth-label" for="login-password">Password</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon" aria-hidden="true">🔑</span>
            <input
              type="password"
              id="login-password"
              class="auth-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="auth-input-eye" id="toggle-password" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <button type="submit" class="auth-submit" id="login-submit-btn">
          <span id="login-btn-text">Sign In</span>
          <span id="login-btn-icon" aria-hidden="true">→</span>
        </button>
      </form>

      <div class="auth-divider">or sign in with</div>

      <div class="social-login-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 16px;">
        <div id="social-google-btn" style="width: 100%; display: flex; justify-content: center; min-height: 40px; margin-bottom: 2px;"></div>

      </div>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html" id="login-goto-signup">Create one →</a>
    </div>

    <div class="auth-terms">
      By signing in you agree to our
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script>
  // Redirect if already logged in
  redirectIfAuthed();

  const form        = document.getElementById('login-form');
  const emailInput  = document.getElementById('login-email');
  const passInput   = document.getElementById('login-password');
  const errorBox    = document.getElementById('login-error');
  const errorText   = document.getElementById('login-error-text');
  const submitBtn   = document.getElementById('login-submit-btn');
  const btnText     = document.getElementById('login-btn-text');
  const togglePass  = document.getElementById('toggle-password');

  // Toggle password visibility
  togglePass.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    togglePass.textContent = isPass ? '🙈' : '👁';
    togglePass.setAttribute('aria-label', isPass ? 'Hide password' : 'Show password');
  });

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.add('show');
    emailInput.classList.add('error');
    passInput.classList.add('error');
  }
  function clearError() {
    errorBox.classList.remove('show');
    emailInput.classList.remove('error');
    passInput.classList.remove('error');
  }

  function doLogin(email, password) {
    submitBtn.classList.add('loading');
    btnText.textContent = 'Signing in…';
    clearError();

    authLogin(email, password).then(result => {
      if (result.ok) {
        btnText.textContent = '✓ Success!';
        setTimeout(() => {
          // Check for redirect param
          const params   = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect');
          window.location.href = redirect || 'dashboard.html';
        }, 500);
      } else {
        submitBtn.classList.remove('loading');
        btnText.textContent = 'Sign In';
        showError(result.error || 'Invalid email or password.');
      }
    }).catch(err => {
      submitBtn.classList.remove('loading');
      btnText.textContent = 'Sign In';
      showError('Authentication request failed.');
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email    = emailInput.value.trim();
    const password = passInput.value;
    if (!email || !password) {
      showError('Please fill in all fields.');
      return;
    }
    doLogin(email, password);
  });



  // Initialize Google Identity Services
  function handleGoogleCredential(response) {
    submitBtn.classList.add('loading');
    btnText.textContent = 'Verifying Google Account…';
    clearError();

    authLoginWithGoogle(response.credential).then(result => {
      if (result.ok) {
        btnText.textContent = '✓ Success!';
        setTimeout(() => {
          const params   = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect');
          window.location.href = redirect || 'dashboard.html';
        }, 500);
      } else {
        submitBtn.classList.remove('loading');
        btnText.textContent = 'Sign In';
        showError(result.error || 'Google authentication failed.');
      }
    }).catch(err => {
      submitBtn.classList.remove('loading');
      btnText.textContent = 'Sign In';
      showError('Google authentication request failed.');
    });
  }

  function initGoogleSignIn() {
    if (typeof google !== 'undefined') {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential
      });
      google.accounts.id.renderButton(
        document.getElementById("social-google-btn"),
        { theme: "filled_black", size: "large", width: "364", shape: "rectangular" }
      );
    } else {
      setTimeout(initGoogleSignIn, 100);
    }
  }
  initGoogleSignIn();

  // Clear errors on input
  emailInput.addEventListener('input', clearError);
  passInput.addEventListener('input',  clearError);

  // Card Mouse Glow Follow
  const authCard = document.querySelector('.auth-card');
  if (authCard) {
    authCard.addEventListener('mousemove', (e) => {
      const rect = authCard.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      authCard.style.setProperty('--mouse-x', `${x}px`);
      authCard.style.setProperty('--mouse-y', `${y}px`);
    });
  }
</script>
</body>
</html>
